name: Run DB Migration and Seed

on:
  push:
    branches:
      - main
    paths:
      - "mysql-init/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  DB_NAME: ${{ vars.DB_NAME }}
  DB_USER: ${{ vars.DB_USER }}

jobs:
  migrate:
    name: Run schema and seed on RDS through backend EC2
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Find one running backend EC2 instance
        id: backend
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Tier,Values=app" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "No running backend EC2 instance found"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Backend instance: $INSTANCE_ID"

      - name: Run migration and seed through SSM
        id: ssm
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "Run Blog app database schema and seed" \
            --instance-ids "${{ steps.backend.outputs.instance_id }}" \
            --parameters commands='[
              "set -e",
              "sudo dnf install -y git mariadb105",
              "rm -rf /tmp/blog-db-migration",
              "git clone https://github.com/${{ github.repository }}.git /tmp/blog-db-migration",
              "cd /tmp/blog-db-migration",
              "RDS_ENDPOINT=$(grep '^DB_HOST=' /opt/blog-backend/.env | cut -d'=' -f2)",
              "echo Running database migration against $RDS_ENDPOINT",
              "mysql -h $RDS_ENDPOINT -u ${{ env.DB_USER }} -p'\''${{ secrets.DB_PASSWORD }}'\'' ${{ env.DB_NAME }} < mysql-init/01-schema.sql",
              "if [ -f mysql-init/02-seed.sql ]; then mysql -h $RDS_ENDPOINT -u ${{ env.DB_USER }} -p'\''${{ secrets.DB_PASSWORD }}'\'' ${{ env.DB_NAME }} < mysql-init/02-seed.sql; fi",
              "echo Database migration and seed completed"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM command id: $COMMAND_ID"

      - name: Wait for migration command result
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          INSTANCE_ID="${{ steps.backend.outputs.instance_id }}"

          for i in {1..40}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Current status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Migration completed successfully"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Migration failed"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
                --output json
              exit 1
            fi

            sleep 10
          done

          echo "Migration timed out waiting for SSM command"
          exit 1
