name: Build and Push Docker Images to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  FRONTEND_ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
  BACKEND_ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}

jobs:
  build-and-push:
    name: Build and Push Frontend and Backend Images
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: vars
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -t $FRONTEND_ECR_REPOSITORY:latest \
            -t $FRONTEND_ECR_REPOSITORY:${{ steps.vars.outputs.SHORT_SHA }} \
            ./client

      - name: Tag and push frontend image
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

          docker tag $FRONTEND_ECR_REPOSITORY:latest $ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:latest
          docker tag $FRONTEND_ECR_REPOSITORY:${{ steps.vars.outputs.SHORT_SHA }} $ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:${{ steps.vars.outputs.SHORT_SHA }}

          docker push $ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:${{ steps.vars.outputs.SHORT_SHA }}

      - name: Build backend Docker image
        run: |
          docker build \
            -t $BACKEND_ECR_REPOSITORY:latest \
            -t $BACKEND_ECR_REPOSITORY:${{ steps.vars.outputs.SHORT_SHA }} \
            ./server

      - name: Tag and push backend image
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

          docker tag $BACKEND_ECR_REPOSITORY:latest $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:latest
          docker tag $BACKEND_ECR_REPOSITORY:${{ steps.vars.outputs.SHORT_SHA }} $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:${{ steps.vars.outputs.SHORT_SHA }}

          docker push $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:${{ steps.vars.outputs.SHORT_SHA }}

      - name: Image summary
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

          echo "Frontend latest: $ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:latest"
          echo "Frontend SHA:    $ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:${{ steps.vars.outputs.SHORT_SHA }}"
          echo "Backend latest:  $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:latest"
          echo "Backend SHA:     $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:${{ steps.vars.outputs.SHORT_SHA }}"
